# File: .github/workflows/build.yml
name: Build SM-X520 Samsung OEM v4l2loopback

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '存放三星 Kernel.tar.gz 或 Opensource.zip 的本仓库 Release Tag（默认 kernel-src）'
        required: false
        default: 'kernel-src'
      kernel_git_url:
        description: '可选：若直接从 Git 仓库克隆 SM-X520 内核树，填 URL（留空则从 Release Asset 拉取）'
        required: false
        default: ''
      kernel_git_branch:
        description: '可选：搭配 kernel_git_url 使用的分支名'
        required: false
        default: ''
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build-samsung-ko:
    runs-on: ubuntu-22.04
    steps:
      - name: 1. Checkout 构建脚本与设备基线原料
        uses: actions/checkout@v4

      - name: 2. 释放磁盘空间并动态补齐 8GiB Swap（方案 A+）
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h / /mnt 2>/dev/null || df -h /

          current_mb=$(awk 'NR>1 {sum+=$3} END {print int(sum/1024)}' /proc/swaps 2>/dev/null || echo 0)
          if (( current_mb < 8192 )); then
            deficit_mb=$(( 8192 - current_mb ))
            (( deficit_mb < 512 )) && deficit_mb=512
            swap_dir="/"
            root_dev=$(stat -c '%d' /)
            mnt_dev=$(stat -c '%d' /mnt 2>/dev/null || echo "$root_dev")
            if [[ -d /mnt && "$mnt_dev" != "$root_dev" ]]; then
              mnt_free_mb=$(df -Pm /mnt | awk 'NR==2 {print $4}')
              (( mnt_free_mb > deficit_mb + 2048 )) && swap_dir="/mnt"
            fi
            swap_file="${swap_dir%/}/ci_extra.swap"
            sudo rm -f "$swap_file"
            if ! (sudo fallocate -l "${deficit_mb}M" "$swap_file" && sudo chmod 600 "$swap_file" && sudo mkswap "$swap_file" >/dev/null && sudo swapon "$swap_file"); then
              sudo rm -f "$swap_file"
              sudo dd if=/dev/zero of="$swap_file" bs=1M count="$deficit_mb" status=none
              sudo chmod 600 "$swap_file"
              sudo mkswap "$swap_file" >/dev/null
              sudo swapon "$swap_file"
            fi
          fi
          swapon --show && df -h /

      - name: 3. 安装交叉编译与解包依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git curl ca-certificates unzip bc bison flex libssl-dev libelf-dev \
            dwarves cpio rsync zstd python3 make gcc-aarch64-linux-gnu gh

      - name: 4. 从 GitHub Release 拉取三星 SM-X520 官方内核归档
        id: fetch_src
        if: ${{ inputs.kernel_git_url == '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p ./release_assets
          RELEASE_TAG="${{ inputs.release_tag || 'kernel-src' }}"
          echo "正在尝试从 Release Tag: ${RELEASE_TAG} 下载内核源码包..."
          gh release download "$RELEASE_TAG" --dir ./release_assets || {
            echo "[WARN] 无法从 Release '$RELEASE_TAG' 自动下载源码包，请确认是否已创建名为 '$RELEASE_TAG' 的 Release 并上传 Kernel.tar.gz！" >&2
            exit 1
          }
          ls -lh ./release_assets
          ARCHIVE=$(find ./release_assets -maxdepth 1 -type f \( -iname '*.tar.gz' -o -iname '*.tgz' -o -iname '*.tar.xz' -o -iname '*.zip' \) | head -n 1 || true)
          [[ -n "$ARCHIVE" ]] || { echo "[ERROR] Release '$RELEASE_TAG' 中未找到 .tar.gz / .zip 内核源码包" >&2; exit 1; }
          echo "archive_path=$(realpath "$ARCHIVE")" >> "$GITHUB_OUTPUT"

      - name: 5. 执行三星 SM-X520 对齐编译与 0x4e276f37 零 Panic 门禁
        env:
          KERNEL_ARCHIVE: ${{ steps.fetch_src.outputs.archive_path }}
          KERNEL_GIT_URL: ${{ inputs.kernel_git_url }}
          KERNEL_GIT_BRANCH: ${{ inputs.kernel_git_branch }}
        run: |
          chmod +x build_samsung_smx520_v4l2.sh
          ./build_samsung_smx520_v4l2.sh

      - name: 6. 上传产物与全量 ABI/Kconfig 诊断报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v4l2loopback-smx520-samsung-oem
          path: |
            v4l2loopback.ko
            gate_report.json
            v4l2loopback_needed_syms.txt
            kconfig_diff.json
            crc_xray_report.json
          if-no-files-found: warn
